name: Full-stack frontend performance

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/frontend-performance-full-stack.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-performance-full-stack
  cancel-in-progress: false

env:
  CEDAR_HOME: ${{ github.workspace }}/CEDAR
  CEDAR_IMAGE_PREFIX: nexus.bmir.stanford.edu/docker-cedar
  CEDAR_BASE_IMAGE_PREFIX: nexus.bmir.stanford.edu/docker-cedar-internal
  CEDAR_TRAIN_VERSION: 2.9.33-dev.20261107.2016

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: CEDAR/cedar-development
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-cli
          ref: 15f8c42164f4945716fb518d92283aa672531895
          path: CEDAR/cedar-cli
      - uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-docker-build
          ref: develop
          path: CEDAR/cedar-docker-build
      - uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-docker-deploy
          ref: develop
          path: CEDAR/cedar-docker-deploy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the control CLI
        run: |
          python -m venv "$CEDAR_HOME/cedar-cli/.venv"
          "$CEDAR_HOME/cedar-cli/.venv/bin/pip" install -r "$CEDAR_HOME/cedar-cli/requirements.txt"
      - name: Initialize an isolated installation
        run: |
          python "$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py" initialize
          bash "$CEDAR_HOME/cedar-cli/cli.sh" mode docker
          bash "$CEDAR_HOME/cedar-cli/cli.sh" env artifact-key init
          bash "$CEDAR_HOME/cedar-cli/cli.sh" docker setup one-time-setup
          sudo sysctl -w vm.max_map_count=262144
          python - <<'PY' | sudo tee -a /etc/hosts > /dev/null
          names='auth resource user group messaging monitor bridge terminology open openview workspace designer monitoring bridging content cedar shared artifact worker repo'.split()
          print('127.0.0.1 '+' '.join(n+'.metadatacenter.orgx' for n in names))
          PY
      - name: Authenticate to the immutable image registry
        env:
          BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
        run: printf '%s' "$BMIR_NEXUS_PASSWORD" | docker login nexus.bmir.stanford.edu --username "$BMIR_NEXUS_USERNAME" --password-stdin
      - name: Start and verify the completed train
        run: bash "$CEDAR_HOME/cedar-cli/cli.sh" docker start all --train "$CEDAR_TRAIN_VERSION" --pull always --timeout 1200
      - name: Record sanitized stack diagnostics
        if: always()
        run: python "$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py" diagnostics --output "$RUNNER_TEMP/stack-diagnostics"
      - name: Stop the ephemeral stack
        if: always()
        run: bash "$CEDAR_HOME/cedar-cli/cli.sh" docker stop all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-stack-diagnostics
          path: ${{ runner.temp }}/stack-diagnostics
          retention-days: 14
