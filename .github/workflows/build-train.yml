name: Immutable development build train

run-name: Build train ${{ inputs.version }}${{ inputs.resume && ' (resume)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable version, for example 2.9.3-dev.20260824.1847
        required: true
        type: string
      resume:
        description: Resume the already-recorded source and Docker manifests
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cedar-development-build-train
  cancel-in-progress: false

env:
  TRAIN_VERSION: ${{ inputs.version }}
  CEDAR_DOCKER_REGISTRY_HOST: nexus.bmir.stanford.edu

jobs:
  publish-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
      TRAIN_WORKSPACE: ${{ github.workspace }}/CEDAR
      TRAIN_STATE: ${{ github.workspace }}/build-trains

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24.19.0 for publication preflight
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Check Nexus credentials
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$state_url" build-trains >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch build-trains "$state_url" "$TRAIN_STATE"
          else
            mkdir -p "$TRAIN_STATE"
            git -C "$TRAIN_STATE" init --quiet
            git -C "$TRAIN_STATE" checkout --quiet --orphan build-trains
            git -C "$TRAIN_STATE" remote add origin "$state_url"
            touch "$TRAIN_STATE/.gitkeep"
          fi
          git -C "$TRAIN_STATE" config user.name github-actions[bot]
          git -C "$TRAIN_STATE" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f "$TRAIN_STATE/completed/$TRAIN_VERSION.json" ]; then
            echo 'MAVEN_ALREADY_COMPLETE=true' >> "$GITHUB_ENV"
          fi

      - name: Capture or restore the source manifest
        run: |
          args=(--version "$TRAIN_VERSION")
          if [ "${{ inputs.resume }}" = "true" ]; then
            args=(--resume "$TRAIN_VERSION")
          fi
          python3 controller/ops/build_train.py prepare \
            "${args[@]}" \
            --workspace "$TRAIN_WORKSPACE" \
            --state "$TRAIN_STATE"

      - name: Preflight every train source and publication target
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/cedar-npmrc
        run: |
          password_base64=$(printf '%s' "$BMIR_NEXUS_PASSWORD" | base64 -w 0)
          printf '%s\n' \
            '@org.metadatacenter:registry=https://nexus.bmir.stanford.edu/repository/npm-cedar/' \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:username=$BMIR_NEXUS_USERNAME" \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:_password=$password_base64" \
            '//nexus.bmir.stanford.edu/repository/npm-cedar/:email=cedar-admin@metadatacenter.org' \
            > "$NPM_CONFIG_USERCONFIG"
          python3 controller/ops/build_train.py preflight \
            --version "$TRAIN_VERSION" \
            --workspace "$TRAIN_WORKSPACE" \
            --state "$TRAIN_STATE"

      - name: Record the source manifest before publication
        run: |
          git -C "$TRAIN_STATE" add "trains/$TRAIN_VERSION.json"
          if ! git -C "$TRAIN_STATE" diff --cached --quiet; then
            git -C "$TRAIN_STATE" commit -m "Record build train $TRAIN_VERSION"
            git -C "$TRAIN_STATE" push origin HEAD:build-trains
          fi

      - name: Build and publish the Maven train
        if: env.MAVEN_ALREADY_COMPLETE != 'true'
        run: |
          args=()
          if [ "${{ inputs.resume }}" = "true" ]; then
            args=(--resume)
          fi
          python3 controller/ops/build_train.py build \
            --version "$TRAIN_VERSION" \
            --workspace "$TRAIN_WORKSPACE" \
            "${args[@]}"

      - name: Verify and advance the completed Maven-train pointer
        if: env.MAVEN_ALREADY_COMPLETE != 'true'
        run: |
          python3 controller/ops/build_train.py complete \
            --version "$TRAIN_VERSION" \
            --state "$TRAIN_STATE"
          git -C "$TRAIN_STATE" add .
          git -C "$TRAIN_STATE" commit -m "Complete build train $TRAIN_VERSION"
          git -C "$TRAIN_STATE" push origin HEAD:build-trains

      - name: Confirm the existing Maven completion on resume
        if: env.MAVEN_ALREADY_COMPLETE == 'true'
        run: echo "Maven train $TRAIN_VERSION was already complete; continuing with npm and Docker publication."

  publish-model:
    name: npm 1/3 · publish TypeScript model
    needs: publish-maven
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/cedar-npmrc

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch build-trains "$state_url" build-trains
          git -C build-trains config user.name github-actions[bot]
          git -C build-trains config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Configure authenticated npm access
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }
          password_base64=$(printf '%s' "$BMIR_NEXUS_PASSWORD" | base64 -w 0)
          printf '%s\n' \
            '@org.metadatacenter:registry=https://nexus.bmir.stanford.edu/repository/npm-cedar/' \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:username=$BMIR_NEXUS_USERNAME" \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:_password=$password_base64" \
            '//nexus.bmir.stanford.edu/repository/npm-cedar/:email=cedar-admin@metadatacenter.org' \
            > "$NPM_CONFIG_USERCONFIG"

      - name: Restore the exact train source checkouts
        run: |
          python3 controller/ops/build_train.py prepare \
            --resume "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Record the complete npm dependency graph before publication
        run: |
          python3 controller/ops/frontend_train.py record-plan \
            --version "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains
          git -C build-trains add "npm/trains/$TRAIN_VERSION.json"
          if ! git -C build-trains diff --cached --quiet; then
            git -C build-trains commit -m "Record npm train $TRAIN_VERSION"
            git -C build-trains push origin HEAD:build-trains
          fi

      - name: Gate, build, publish, and verify the captured TypeScript model
        run: |
          python3 controller/ops/frontend_train.py publish-model \
            --version "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Record the verified model artifact
        run: |
          git -C build-trains add "npm/model/completed/$TRAIN_VERSION.json"
          if ! git -C build-trains diff --cached --quiet; then
            git -C build-trains commit -m "Complete npm model for $TRAIN_VERSION"
            git -C build-trains push origin HEAD:build-trains
          fi

  publish-cee:
    name: npm 2/3 · wire model and publish CEE
    needs: publish-model
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/cedar-npmrc

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch build-trains "$state_url" build-trains
          git -C build-trains config user.name github-actions[bot]
          git -C build-trains config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Configure authenticated npm access
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }
          password_base64=$(printf '%s' "$BMIR_NEXUS_PASSWORD" | base64 -w 0)
          printf '%s\n' \
            '@org.metadatacenter:registry=https://nexus.bmir.stanford.edu/repository/npm-cedar/' \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:username=$BMIR_NEXUS_USERNAME" \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:_password=$password_base64" \
            '//nexus.bmir.stanford.edu/repository/npm-cedar/:email=cedar-admin@metadatacenter.org' \
            > "$NPM_CONFIG_USERCONFIG"

      - name: Restore the exact train source checkouts
        run: |
          python3 controller/ops/build_train.py prepare \
            --resume "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Wire the train model, then gate, build, publish, and verify CEE
        run: |
          python3 controller/ops/frontend_train.py publish-cee \
            --version "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Record the verified CEE artifact
        run: |
          git -C build-trains add "npm/cee/completed/$TRAIN_VERSION.json"
          if ! git -C build-trains diff --cached --quiet; then
            git -C build-trains commit -m "Complete npm CEE for $TRAIN_VERSION"
            git -C build-trains push origin HEAD:build-trains
          fi

  publish-frontends:
    name: npm 3/3 · wire consumers and publish frontends
    needs: publish-cee
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/cedar-npmrc

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch build-trains "$state_url" build-trains
          git -C build-trains config user.name github-actions[bot]
          git -C build-trains config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Configure authenticated npm access
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }
          password_base64=$(printf '%s' "$BMIR_NEXUS_PASSWORD" | base64 -w 0)
          printf '%s\n' \
            '@org.metadatacenter:registry=https://nexus.bmir.stanford.edu/repository/npm-cedar/' \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:username=$BMIR_NEXUS_USERNAME" \
            "//nexus.bmir.stanford.edu/repository/npm-cedar/:_password=$password_base64" \
            '//nexus.bmir.stanford.edu/repository/npm-cedar/:email=cedar-admin@metadatacenter.org' \
            > "$NPM_CONFIG_USERCONFIG"

      - name: Restore the exact train source checkouts
        run: |
          python3 controller/ops/build_train.py prepare \
            --resume "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Wire all seven CEE consumers and rebuild bundled consumers
        run: |
          python3 controller/ops/frontend_train.py prepare-frontends \
            --version "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Record exact frontend wiring before publication
        run: |
          git -C build-trains add "npm/trains/$TRAIN_VERSION.json"
          if ! git -C build-trains diff --cached --quiet; then
            git -C build-trains commit -m "Record npm wiring for $TRAIN_VERSION"
            git -C build-trains push origin HEAD:build-trains
          fi

      - name: Publish the seven train frontend packages
        run: |
          python3 controller/ops/frontend_train.py publish-frontends \
            --version "$TRAIN_VERSION" \
            --workspace "$RUNNER_TEMP/CEDAR" \
            --state build-trains

      - name: Verify npm tarballs and advance the npm pointer
        run: |
          python3 controller/ops/frontend_train.py complete \
            --version "$TRAIN_VERSION" \
            --state build-trains
          git -C build-trains add npm
          if ! git -C build-trains diff --cached --quiet; then
            git -C build-trains commit -m "Complete npm train $TRAIN_VERSION"
            git -C build-trains push origin HEAD:build-trains
          fi

  record-docker-plan:
    needs: [publish-maven, publish-frontends]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      java_base: ${{ steps.matrix.outputs.java_base }}
      microservice_base: ${{ steps.matrix.outputs.microservice_base }}
      infrastructure: ${{ steps.matrix.outputs.infrastructure }}
      microservices: ${{ steps.matrix.outputs.microservices }}
      frontends: ${{ steps.matrix.outputs.frontends }}

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch build-trains "$state_url" build-trains
          git -C build-trains config user.name github-actions[bot]
          git -C build-trains config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Record the complete expected image set
        run: |
          python3 controller/ops/docker_train.py record-plan \
            --version "$TRAIN_VERSION" \
            --state build-trains
          git -C build-trains add "docker/trains/$TRAIN_VERSION.json"
          if ! git -C build-trains diff --cached --quiet; then
            git -C build-trains commit -m "Record Docker train $TRAIN_VERSION"
            git -C build-trains push origin HEAD:build-trains
          fi

      - name: Export build matrices
        id: matrix
        run: |
          echo "java_base=$(python3 controller/ops/docker_train.py matrix --group javaBase)" >> "$GITHUB_OUTPUT"
          echo "microservice_base=$(python3 controller/ops/docker_train.py matrix --group microserviceBase)" >> "$GITHUB_OUTPUT"
          echo "infrastructure=$(python3 controller/ops/docker_train.py matrix --group infrastructure)" >> "$GITHUB_OUTPUT"
          echo "microservices=$(python3 controller/ops/docker_train.py matrix --group microservices)" >> "$GITHUB_OUTPUT"
          echo "frontends=$(python3 controller/ops/docker_train.py matrix --group frontends)" >> "$GITHUB_OUTPUT"

  java-base:
    needs: record-docker-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image: ${{ fromJSON(needs.record-docker-plan.outputs.java_base) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
      - name: Build and publish ${{ matrix.image }}
        env:
          BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
        run: bash controller/ops/publish-docker-image-ci.sh "${{ matrix.image }}"

  microservice-base:
    needs: [record-docker-plan, java-base]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image: ${{ fromJSON(needs.record-docker-plan.outputs.microservice_base) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
      - name: Build and publish ${{ matrix.image }}
        env:
          BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
        run: bash controller/ops/publish-docker-image-ci.sh "${{ matrix.image }}"

  infrastructure:
    needs: record-docker-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        image: ${{ fromJSON(needs.record-docker-plan.outputs.infrastructure) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
      - name: Build and publish ${{ matrix.image }}
        env:
          BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
        run: bash controller/ops/publish-docker-image-ci.sh "${{ matrix.image }}"

  microservices:
    needs: [record-docker-plan, microservice-base]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        image: ${{ fromJSON(needs.record-docker-plan.outputs.microservices) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
      - name: Build and publish ${{ matrix.image }}
        env:
          BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
        run: bash controller/ops/publish-docker-image-ci.sh "${{ matrix.image }}"

  frontends:
    needs: record-docker-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        image: ${{ fromJSON(needs.record-docker-plan.outputs.frontends) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
      - name: Build and publish ${{ matrix.image }}
        env:
          BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
        run: bash controller/ops/publish-docker-image-ci.sh "${{ matrix.image }}"

  verify-docker-train:
    needs: [record-docker-plan, java-base, microservice-base, infrastructure, microservices, frontends]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch build-trains "$state_url" build-trains
          git -C build-trains config user.name github-actions[bot]
          git -C build-trains config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Authenticate to the Nexus Docker registry
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }
          printf '%s' "$BMIR_NEXUS_PASSWORD" | docker login "$CEDAR_DOCKER_REGISTRY_HOST" \
            --username "$BMIR_NEXUS_USERNAME" --password-stdin

      - name: Pull and verify all 31 core images
        run: |
          python3 controller/ops/docker_train.py verify \
            --version "$TRAIN_VERSION" \
            --state build-trains

      - name: Advance the completed Docker-train pointer
        run: |
          git -C build-trains add docker
          git -C build-trains commit -m "Complete Docker train $TRAIN_VERSION"
          git -C build-trains push origin HEAD:build-trains
