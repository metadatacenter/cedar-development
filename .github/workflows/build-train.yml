name: Docker fresh-stack acceptance rehearsal

run-name: Docker acceptance rehearsal ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable version, for example 2.9.3-dev.20260824.1847
        required: true
        type: string
      resume:
        description: Resume the already-recorded source and Docker manifests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cedar-runtime-acceptance-rehearsal
  cancel-in-progress: false

env:
  TRAIN_VERSION: ${{ inputs.version }}
  CEDAR_DOCKER_REGISTRY_HOST: nexus.bmir.stanford.edu
  # Dependency install scripts are reviewed and version-pinned in each owning package.json.
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  verify-docker-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CEDAR_HOME: ${{ github.workspace }}/CEDAR
      CEDAR_TRAIN_VERSION: ${{ inputs.version }}
      CEDAR_IMAGE_PREFIX: nexus.bmir.stanford.edu/docker-cedar
      CEDAR_BASE_IMAGE_PREFIX: nexus.bmir.stanford.edu/docker-cedar-internal
      CEDAR_KEYCLOAK_BASE: http://127.0.0.1:8080
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Check out the build-train state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch build-trains "$state_url" build-trains
          git -C build-trains config user.name github-actions[bot]
          git -C build-trains config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Authenticate to the Nexus Docker registry
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }
          printf '%s' "$BMIR_NEXUS_PASSWORD" | docker login "$CEDAR_DOCKER_REGISTRY_HOST" \
            --username "$BMIR_NEXUS_USERNAME" --password-stdin

      - name: Pull and verify all 27 core images
        run: |
          python3 controller/ops/docker_train.py verify \
            --version "$TRAIN_VERSION" \
            --state build-trains

      - name: Check out the captured acceptance tooling
        run: python3 controller/ops/docker_acceptance.py checkout --state "$GITHUB_WORKSPACE/build-trains"

      - name: Use the corrected rehearsal harness without changing any image or captured source manifest
        run: |
          git -C "$CEDAR_HOME/cedar-development" fetch --depth 1 origin "$GITHUB_SHA"
          git -C "$CEDAR_HOME/cedar-development" checkout --detach FETCH_HEAD

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the captured CLI and browser harness
        run: |
          python -m venv "$CEDAR_HOME/cedar-cli/.venv"
          "$CEDAR_HOME/cedar-cli/.venv/bin/pip" install -r "$CEDAR_HOME/cedar-cli/requirements.txt"
          cd "$CEDAR_HOME/cedar-development/ops/e2e"
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify production and non-production configuration of the same UI payloads
        run: |
          for application in openview monitoring bridging; do
            image="$CEDAR_IMAGE_PREFIX/cedar-frontend-$application:$TRAIN_VERSION"
            docker pull "$image"
            python "$CEDAR_HOME/cedar-docker-build/tests/check_angular_image.py" "$image"
          done

      - name: Initialize an empty installation without compatibility mounts
        run: |
          python "$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py" initialize --candidate-state "$GITHUB_WORKSPACE/build-trains"
          bash "$CEDAR_HOME/cedar-cli/cli.sh" mode docker
          bash "$CEDAR_HOME/cedar-cli/cli.sh" env artifact-key init
          bash "$CEDAR_HOME/cedar-cli/cli.sh" docker setup one-time-setup
          sudo sysctl -w vm.max_map_count=262144
          python - <<'PYTHON' | sudo tee -a /etc/hosts > /dev/null
          names='auth resource user group messaging monitor bridge terminology open openview workspace designer monitoring bridging content cedar shared artifact worker repo'.split()
          print('127.0.0.1 '+' '.join(n+'.metadatacenter.orgx' for n in names))
          PYTHON

      - name: Start the verified candidate from empty volumes
        run: bash "$CEDAR_HOME/cedar-cli/cli.sh" docker start all --train "$TRAIN_VERSION" --verified-state "$GITHUB_WORKSPACE/build-trains" --pull always --timeout 600

      - name: Capture deployment identity and provision the read-only monitor
        run: |
          helper="$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py"
          python "$helper" assets --candidate-state "$GITHUB_WORKSPACE/build-trains" --output "$RUNNER_TEMP/acceptance-inputs"
          python "$helper" monitor-account --candidate-state "$GITHUB_WORKSPACE/build-trains"

      - name: Check real deployed pages and standalone components with real APIs and SSO
        run: bash "$CEDAR_HOME/cedar-cli/cli.sh" test frontend-performance --samples 1 --profiles normal --deployment-manifest "$RUNNER_TEMP/acceptance-inputs/manifest.json" --output "$RUNNER_TEMP/docker-acceptance"

      - name: Record required fresh-stack acceptance
        run: python controller/ops/docker_acceptance.py record --state "$GITHUB_WORKSPACE/build-trains" --report "$RUNNER_TEMP/docker-acceptance/report.json"

      # Rehearsal evidence is retained as an artifact only. Token permissions are read-only;
      # neither completion nor a current pointer can be pushed to build-trains.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-fresh-stack-acceptance
          path: |
            ${{ runner.temp }}/docker-acceptance/report.json
            ${{ runner.temp }}/docker-acceptance/report.html
            ${{ runner.temp }}/docker-acceptance/samples.csv
            ${{ runner.temp }}/docker-acceptance/*.png
            ${{ runner.temp }}/docker-acceptance/lab/artifacts.json
            ${{ runner.temp }}/acceptance-inputs/manifest.json
          retention-days: 30
      - name: Record sanitized acceptance diagnostics
        if: always()
        run: |
          helper="$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py"
          if [ -f "$helper" ]; then
            python "$helper" diagnostics --candidate-state "$GITHUB_WORKSPACE/build-trains" --output "$RUNNER_TEMP/acceptance-diagnostics"
          fi
      - name: Stop the ephemeral acceptance stack
        if: always()
        run: |
          if [ -f "$CEDAR_HOME/.cedar/mode" ] || [ -d "$CEDAR_HOME/cedar-cli/.venv" ]; then
            bash "$CEDAR_HOME/cedar-cli/cli.sh" docker stop all
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-fresh-stack-diagnostics
          path: ${{ runner.temp }}/acceptance-diagnostics
          retention-days: 14
