name: Standalone frontend performance

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      baseline-ref:
        type: string
        required: true
      candidate-artifact:
        type: string
        required: true
      harness-ref:
        description: Exact cedar-development commit, matching the reusable workflow pin
        type: string
        required: true

permissions:
  contents: read

jobs:
  compare:
    name: Paired rendering (advisory timing, required loading)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
      COMPONENT: ${{ inputs.component }}
      BASELINE_REF: ${{ inputs.baseline-ref }}
      CANDIDATE_REF: ${{ github.sha }}
    steps:
      - name: Validate component
        run: |
          case "$COMPONENT" in cee|ced|designer) ;; *) exit 2 ;; esac

      - name: Check out the pinned measurement harness
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-development
          ref: ${{ inputs.harness-ref }}
          path: cedar-development

      - name: Check out the comparison base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline-ref }}
          path: baseline-source

      - name: Read the fixed post-optimization reference
        id: reference
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('cedar-development/ops/e2e/frontend-perf/references.json','utf8'));
          const sha=config.components[process.env.COMPONENT];
          if(!/^[0-9a-f]{40}$/.test(sha ?? '')) throw new Error('Missing fixed reference');
          console.log('sha='+sha);
          console.log('bundle='+(sha===process.env.BASELINE_REF?'baseline-input':'reference-input'));
          JS

      - name: Check out the fixed reference when it differs from the comparison base
        if: steps.reference.outputs.sha != inputs.baseline-ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.reference.outputs.sha }}
          path: reference-source

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            baseline-source/package-lock.json
            cedar-development/ops/e2e/package-lock.json

      # Candidate bytes come from the existing build job. No second candidate build,
      # no registry publication and no changes to tracked package pins.
      - name: Restore this workflow's candidate bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate

      - name: Build comparison inputs before starting measurements
        env:
          REFERENCE_BUNDLE: ${{ steps.reference.outputs.bundle }}
        run: |
          build_bundle() (
            cd "$1"
            npm ci
            if [ "$COMPONENT" = cee ]; then
              npm --prefix visual ci
              npm run build:production
              npm --prefix visual run bundle
              cp visual/public/cedar-embeddable-editor.js "$GITHUB_WORKSPACE/$2"
            elif [ "$COMPONENT" = designer ]; then
              npm run prepare:components
              cp -R app "$GITHUB_WORKSPACE/$2"
            else
              npm run build
              npm run bundle
              cp dist-bundle/cedar-embeddable-designer.js "$GITHUB_WORKSPACE/$2"
            fi
          )
          build_bundle baseline-source baseline-input
          if [ "$REFERENCE_BUNDLE" = reference-input ]; then
            build_bundle reference-source reference-input
          fi

      - name: Install the locked harness and browser
        working-directory: cedar-development/ops/e2e
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Measure paired base and fixed-reference comparisons
        env:
          REFERENCE_BUNDLE: ${{ steps.reference.outputs.bundle }}
          REFERENCE_REF: ${{ steps.reference.outputs.sha }}
        working-directory: cedar-development/ops/e2e
        run: |
          case "$COMPONENT" in
            cee) bundle=cedar-embeddable-editor.js ;;
            ced) bundle=cedar-embeddable-designer.js ;;
            designer) bundle=. ;;
          esac
          node frontend-perf/compare.mjs --component="$COMPONENT" \
            --baseline="$GITHUB_WORKSPACE/baseline-input" \
            --candidate="$GITHUB_WORKSPACE/candidate/$bundle" \
            --baseline-revision="$BASELINE_REF" --candidate-revision="$CANDIDATE_REF" \
            --reference="$GITHUB_WORKSPACE/$REFERENCE_BUNDLE" --reference-revision="$REFERENCE_REF" \
            --output="$GITHUB_WORKSPACE/performance-report"

      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f performance-report/summary.md ]; then
            cat performance-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Performance comparison incomplete: setup failed before measurement.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate advisory findings
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, existsSync} from 'node:fs';
          if (existsSync('performance-report/comparison.json')) {
            const report = JSON.parse(readFileSync('performance-report/comparison.json', 'utf8'));
            for (const [label, comparison] of Object.entries(report.comparisons)) {
              for (const row of comparison.attempts[comparison.selected-1]?.report.comparison ?? []) {
                if (row.status !== 'within-advisory-tolerance') {
                  console.log(`::warning::${label}: ${row.scenario}/${row.cache} ${row.metric}: ${row.status}. See performance summary; timing budgets are advisory.`);
                }
              }
            }
          }
          JS

      - name: Retain measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ inputs.component }}-performance
          path: |
            performance-report/comparison.json
            performance-report/summary.md
            performance-report/*/report.json
            performance-report/*/summary.md
            performance-report/*/*.png
          if-no-files-found: warn
          retention-days: 30
