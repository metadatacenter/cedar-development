name: Release tooling CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: train and lifecycle controllers (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out cedar-development
        uses: actions/checkout@v7
        with:
          path: cedar-development

      # The frontend reactor runtime loads cedar-cli's npm install rule from the checkout beside
      # this one, as it does on a workstation, so its suite needs cedar-cli where CEDAR_HOME would
      # put it.
      - name: Check out cedar-cli
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-cli
          ref: develop
          path: cedar-cli

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The frontend train suite shells out to node and npm. Both happen to be present on the
      # hosted runners, so the suite passed without asking for them, and would have started failing
      # on whichever runner image dropped them first.
      - name: Set up Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      # REST contracts are checked against each service's committed OpenAPI, as on a workstation.
      # Sparse checkouts supply the schemas without building or starting the services.
      - name: Check out resource REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-resource-server
          ref: develop
          path: cedar-resource-server
          sparse-checkout: cedar-resource-server-application/src/main/resources/assets/swagger-api

      - name: Check out artifact REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-artifact-server
          ref: develop
          path: cedar-artifact-server
          sparse-checkout: cedar-artifact-server-application/src/main/resources/assets/swagger-api

      - name: Check out repo REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-repo-server
          ref: develop
          path: cedar-repo-server
          sparse-checkout: cedar-repo-server-application/src/main/resources/assets/swagger-api

      - name: Check out terminology REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-terminology-server
          ref: develop
          path: cedar-terminology-server
          sparse-checkout: cedar-terminology-server-application/src/main/resources/assets/swagger-api

      - name: Check out user REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-user-server
          ref: develop
          path: cedar-user-server
          sparse-checkout: cedar-user-server-application/src/main/resources/assets/swagger-api

      - name: Check out impex REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-impex-server
          ref: develop
          path: cedar-impex-server
          sparse-checkout: cedar-impex-server-application/src/main/resources/assets/swagger-api

      - name: Check out group REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-group-server
          ref: develop
          path: cedar-group-server
          sparse-checkout: cedar-group-server-application/src/main/resources/assets/swagger-api

      - name: Check out worker REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-worker-server
          ref: develop
          path: cedar-worker-server
          sparse-checkout: cedar-worker-server-application/src/main/resources/assets/swagger-api

      - name: Check out messaging REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-messaging-server
          ref: develop
          path: cedar-messaging-server
          sparse-checkout: cedar-messaging-server-application/src/main/resources/assets/swagger-api

      - name: Check out openview REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-openview-server
          ref: develop
          path: cedar-openview-server
          sparse-checkout: cedar-openview-server-application/src/main/resources/assets/swagger-api

      - name: Check out monitor REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-monitor-server
          ref: develop
          path: cedar-monitor-server
          sparse-checkout: cedar-monitor-server-application/src/main/resources/assets/swagger-api

      - name: Check out bridge REST contracts
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-bridge-server
          ref: develop
          path: cedar-bridge-server
          sparse-checkout: cedar-bridge-server-application/src/main/resources/assets/swagger-api

      - name: Install REST harness dependencies
        working-directory: cedar-development/ops/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check every REST harness test without a stack
        working-directory: cedar-development/ops/e2e
        run: npm run test:rest-harness

      - name: Check the search matrix harness without a stack
        working-directory: cedar-development/ops/e2e
        run: npm run test:search-harness

      - name: Check journey scheduling and authentication safeguards without a stack
        working-directory: cedar-development/ops/e2e
        run: npm run test:journey-runner

      # Ops utilities and performance harness logic use built-ins, temporary
      # trees and stubbed requests; no npm packages, running stack or sibling servers are needed.
      - name: Run the Node ops and performance harness suites
        working-directory: cedar-development
        run: node --test ops/test-*.mjs ops/e2e/rest-perf/test/*.test.mjs

      # Python suites under ops/, ops/tests and ops/repairs. They mock publication and service
      # operations, stand in for the deployment and the library bridges, and never start a CEDAR
      # service or write external state. Each directory is its own start directory, because the
      # modules load their siblings by path rather than as a package.
      - name: Run the ops suites
        working-directory: cedar-development
        run: |
          python -m unittest discover -v -s ops -t ops -p 'test_*.py'
          python -m unittest discover -v -s ops/tests -t ops/tests -p 'test_*.py'
          python -m unittest discover -v -s ops/repairs -t ops/repairs -p 'test_*.py'

  # The YAML conversion audit's end-to-end suite runs both model libraries for real, so it needs
  # what a workstation has beside this checkout: the Java artifact and validation libraries built,
  # the TypeScript library's dist, and the shared corpus. The job above has none of them and skips
  # the suite, which is how a corpus definition the libraries had begun to refuse went unnoticed.
  # This job lays the repositories out as CEDAR_HOME would, builds them, and requires the suite
  # to run rather than skip.
  conversion-audit:
    name: YAML conversion audit with both model libraries (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}
      CEDAR_HOME: ${{ github.workspace }}
      CEDAR_REQUIRE_CONVERSION_TOOLCHAIN: "1"

    steps:
      - name: Check out cedar-development
        uses: actions/checkout@v7
        with:
          path: cedar-development

      - name: Check out cedar-artifact-library
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-artifact-library
          ref: develop
          path: cedar-artifact-library

      - name: Check out cedar-model-validation-library
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-model-validation-library
          ref: develop
          path: cedar-model-validation-library

      - name: Check out cedar-model-typescript-library
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-model-typescript-library
          ref: develop
          path: cedar-model-typescript-library

      - name: Check out the shared corpus
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-test-artifacts
          ref: develop
          path: cedar-test-artifacts

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: conversion-audit-maven-${{ runner.os }}-${{ hashFiles('cedar-artifact-library/**/pom.xml', 'cedar-model-validation-library/**/pom.xml') }}
          restore-keys: conversion-audit-maven-${{ runner.os }}-

      # The audit resolves each library's classpath with a plain `mvn`, so the libraries' own Nexus
      # settings become the user settings here, with the credentials read from the environment.
      - name: Use the libraries' Nexus settings for Maven
        run: |
          mkdir -p ~/.m2
          cp cedar-artifact-library/.m2/nexus-settings.xml ~/.m2/settings.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Build the TypeScript model library
        working-directory: cedar-model-typescript-library
        run: |
          npm ci
          npm run build

      - name: Compile the Java validation and artifact libraries
        run: |
          for library in cedar-model-validation-library cedar-artifact-library; do
            (cd "$library" && ./mvnw --batch-mode --no-transfer-progress --update-snapshots -DskipTests compile)
          done

      - name: Run the YAML conversion audit end to end
        working-directory: cedar-development
        run: python -m unittest discover -v -s ops/tests -t ops/tests -p 'test_cedar_yaml_conversion_audit.py'
