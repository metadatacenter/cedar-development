name: Release tooling CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: train and lifecycle controllers (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out cedar-development
        uses: actions/checkout@v7
        with:
          path: cedar-development

      # The frontend reactor runtime loads cedar-cli's npm install rule from the checkout beside
      # this one, as it does on a workstation, so its suite needs cedar-cli where CEDAR_HOME would
      # put it.
      - name: Check out cedar-cli
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-cli
          ref: develop
          path: cedar-cli

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The frontend train suite shells out to node and npm. Both happen to be present on the
      # hosted runners, so the suite passed without asking for them, and would have started failing
      # on whichever runner image dropped them first.
      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Check the search matrix harness without a stack
        working-directory: cedar-development/ops/e2e
        run: npm run test:search-harness

      # Ops utilities, REST scheduling and performance harness logic use built-ins, temporary
      # trees and stubbed requests; no npm packages, running stack or sibling servers are needed.
      - name: Run the Node ops, REST scheduler and performance harness suites
        working-directory: cedar-development
        run: node --test ops/test-*.mjs ops/e2e/rest/scheduler.test.mjs ops/e2e/rest-perf/test/*.test.mjs

      # Python suites under ops/, ops/tests and ops/repairs. They mock publication and service
      # operations, stand in for the deployment and the library bridges, and never start a CEDAR
      # service or write external state. Each directory is its own start directory, because the
      # modules load their siblings by path rather than as a package.
      - name: Run the ops suites
        working-directory: cedar-development
        run: |
          python -m unittest discover -v -s ops -t ops -p 'test_*.py'
          python -m unittest discover -v -s ops/tests -t ops/tests -p 'test_*.py'
          python -m unittest discover -v -s ops/repairs -t ops/repairs -p 'test_*.py'
