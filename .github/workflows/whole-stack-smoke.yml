name: Whole-stack smoke of the current Docker train

run-name: Whole-stack smoke ${{ inputs.version || 'of the current Docker train' }}

# The train workflow runs the same smoke before it completes a train. This run repeats it on a
# cadence against the newest completed train, so a failure that depends on time, an external
# service or the runner image shows up between trains. It records nothing in the train state.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Completed train to smoke; empty selects the current Docker train
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cedar-development-whole-stack-smoke
  cancel-in-progress: false

env:
  CEDAR_DOCKER_REGISTRY_HOST: nexus.bmir.stanford.edu
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CEDAR_HOME: ${{ github.workspace }}/CEDAR
      CEDAR_IMAGE_PREFIX: nexus.bmir.stanford.edu/docker-cedar
      CEDAR_BASE_IMAGE_PREFIX: nexus.bmir.stanford.edu/docker-cedar-internal
      CEDAR_KEYCLOAK_BASE: http://127.0.0.1:8080
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

    steps:
      - name: Check out the train controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller

      - name: Check out the build-train state branch
        run: git clone --quiet --depth 1 --branch build-trains "https://github.com/${GITHUB_REPOSITORY}.git" build-trains

      - name: Select the completed train
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(python3 -c 'import json; print(json.load(open("build-trains/docker/current.json"))["version"])')}"
          test -f "build-trains/docker/completed/$version.json" || { echo "$version is not a completed Docker train"; exit 1; }
          echo "TRAIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "CEDAR_TRAIN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Authenticate to the Nexus Docker registry
        run: |
          test -n "$BMIR_NEXUS_USERNAME" || { echo 'BMIR_NEXUS_USERNAME is unavailable to cedar-development'; exit 1; }
          test -n "$BMIR_NEXUS_PASSWORD" || { echo 'BMIR_NEXUS_PASSWORD is unavailable to cedar-development'; exit 1; }
          printf '%s' "$BMIR_NEXUS_PASSWORD" | docker login "$CEDAR_DOCKER_REGISTRY_HOST" \
            --username "$BMIR_NEXUS_USERNAME" --password-stdin

      - name: Check out the captured acceptance tooling
        run: python3 controller/ops/docker_acceptance.py checkout --state "$GITHUB_WORKSPACE/build-trains"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the captured CLI and browser harness
        run: |
          python -m venv "$CEDAR_HOME/cedar-cli/.venv"
          "$CEDAR_HOME/cedar-cli/.venv/bin/pip" install -r "$CEDAR_HOME/cedar-cli/requirements.txt"
          cd "$CEDAR_HOME/cedar-development/ops/e2e"
          npm ci
          npx playwright install --with-deps chromium

      - name: Initialize an empty installation without compatibility mounts
        run: |
          python "$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py" initialize --candidate-state "$GITHUB_WORKSPACE/build-trains"
          bash "$CEDAR_HOME/cedar-cli/cli.sh" mode docker
          bash "$CEDAR_HOME/cedar-cli/cli.sh" env artifact-key init
          bash "$CEDAR_HOME/cedar-cli/cli.sh" docker setup one-time-setup
          sudo sysctl -w vm.max_map_count=262144
          python - <<'PYTHON' | sudo tee -a /etc/hosts > /dev/null
          names='auth resource user group messaging monitor bridge terminology open openview workspace designer monitoring bridging content cedar shared artifact worker repo'.split()
          print('127.0.0.1 '+' '.join(n+'.metadatacenter.orgx' for n in names))
          PYTHON

      - name: Start the completed train from empty volumes
        run: bash "$CEDAR_HOME/cedar-cli/cli.sh" docker start all --train "$TRAIN_VERSION" --verified-state "$GITHUB_WORKSPACE/build-trains" --pull always --timeout 600

      - name: Check out the sources the smoke tiers read beside the stack
        run: python controller/ops/docker_acceptance.py smoke-sources --state "$GITHUB_WORKSPACE/build-trains" --settings controller/ops/maven-train-settings.xml

      - name: Run every whole-stack smoke tier against the train
        run: bash "$CEDAR_HOME/cedar-cli/cli.sh" test e2e --train "$TRAIN_VERSION" --train-state "$GITHUB_WORKSPACE/build-trains"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whole-stack-smoke
          path: ${{ env.CEDAR_HOME }}/cedar-development/ops/e2e/reports/smoke-gate
          retention-days: 30
      - name: Record sanitized stack diagnostics
        if: always()
        run: |
          helper="$CEDAR_HOME/cedar-development/ops/e2e/frontend-perf/full_stack_ci.py"
          if [ -f "$helper" ]; then
            python "$helper" diagnostics --candidate-state "$GITHUB_WORKSPACE/build-trains" --output "$RUNNER_TEMP/stack-diagnostics"
          fi
      - name: Stop the ephemeral stack
        if: always()
        run: |
          if [ -f "$CEDAR_HOME/.cedar/mode" ] || [ -d "$CEDAR_HOME/cedar-cli/.venv" ]; then
            bash "$CEDAR_HOME/cedar-cli/cli.sh" docker stop all
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whole-stack-smoke-diagnostics
          path: ${{ runner.temp }}/stack-diagnostics
          retention-days: 14
