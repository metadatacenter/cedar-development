error_log                       /Users/cedar-dev/CEDAR/log/nginx/nginx-error.log;
proxy_http_version              1.1; #this is essential for chunked responses
proxy_set_header                X-Real-IP $remote_addr;
proxy_set_header                X-Forwarded-Proto $scheme;
proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header                Host $host;
proxy_intercept_errors          on;
proxy_buffering                 on;
proxy_buffer_size               128k;
proxy_buffers                   4 256k;
proxy_busy_buffers_size         256k;
client_max_body_size            4m;

map $status $loggable {
    ~^[3]   0;
    default 1;
}

# Rate limit for the bridge's external-authority routes. Declared here because limit_req_zone is
# only valid in the http context. See server-bridge.inc.conf for why these routes in particular.
limit_req_zone                  $binary_remote_addr zone=cedar_ext_auth:10m rate=10r/s;
