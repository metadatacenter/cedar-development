upstream cedar-backend-bridge {
    server              127.0.0.1:9015;
}

server {
    listen              80;
    server_name         bridge.metadatacenter.orgx;
    return              301 https://bridge.metadatacenter.orgx$request_uri;
}

server {
    listen              443 ssl;
    server_name         bridge.metadatacenter.orgx;
    ssl_certificate     /opt/homebrew/etc/nginx/cedar/ssl/bridge.metadatacenter.orgx/bridge.metadatacenter.orgx.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/cedar/ssl/bridge.metadatacenter.orgx/bridge.metadatacenter.orgx.key;
    location / {
        proxy_pass      http://cedar-backend-bridge;
    }
    # CEDAR proxies these to seven third-party registries, and three of them are called with
    # credentials the deployment holds. The routes take none of their own, because the embeddable
    # editor calls them from a browser that has none to give and no place to keep one.
    #
    # Rate limiting rather than authentication is what bounds the abuse: a key shipped to a browser
    # application is not a secret, so requiring one would stop nobody who wanted to relay through
    # here, while breaking every host that embeds the editor. 10r/s with a burst of 20 is well above
    # a person typing into a lookup field and well below a useful relay.
    location /ext-auth/ {
        limit_req        zone=cedar_ext_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass       http://cedar-backend-bridge;
    }
    location /api {
        alias           /Users/cedar-dev/CEDAR/cedar-swagger-ui;
    }
    error_log           /Users/cedar-dev/CEDAR/log/server-bridge/nginx-error.log warn;
    access_log          /Users/cedar-dev/CEDAR/log/server-bridge/nginx-access.log combined if=$loggable;
}
