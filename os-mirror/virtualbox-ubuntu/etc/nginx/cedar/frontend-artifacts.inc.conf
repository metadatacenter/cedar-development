server {
    listen          80;
    server_name     artifacts.metadatacenter.orgx;
    return          301 https://monitoring.metadatacenter.orgx$request_uri;
}

server {
    listen          443 ssl;
    server_name     artifacts.metadatacenter.orgx;
    include         cedar/include-ssl.conf;
    root /home/cedar/CEDAR/cedar-artifacts/cedar-artifacts-dist;

    # --- Cache control: prevent stale UI after deploy (added 2026-07-28) ---
    # Never cache the SPA entry HTML; .html/.css always revalidate.
    location = /index.html    { add_header Cache-Control "no-store" always; }
    location ~* \.(html|css)$ { add_header Cache-Control "no-cache" always; }
    location / {
		                try_files $uri /index.html;
    }
    error_log       /home/cedar/CEDAR/log/cedar-frontend-artifacts/nginx-error.log warn;
    access_log      /home/cedar/CEDAR/log/cedar-frontend-artifacts/nginx-access.log combined if=$loggable;
}
