server {
    listen          80;
    server_name     openview.metadatacenter.orgx;
    return          301 https://openview.metadatacenter.orgx$request_uri;
}

server {
    listen          443 ssl;
    server_name     openview.metadatacenter.orgx;
    include         cedar/include-ssl.conf;
    root /home/cedar/CEDAR/cedar-openview/cedar-openview-dist;

    location = /index.html { add_header Cache-Control "no-store" always; }
    location ^~ /config/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # esbuild names a hashed file name-XXXXXXXX.js, the hash being eight upper-case base32 characters.
    location ~ "-[A-Z2-7]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
    error_log       /home/cedar/CEDAR/log/cedar-frontend-openview/nginx-error.log warn;
    access_log      /home/cedar/CEDAR/log/cedar-frontend-openview/nginx-access.log combined if=$loggable;
}
