upstream cedar-backend-artifact {
    server 127.0.0.1:9001;
}

server {
    listen          80;
    server_name     artifact.metadatacenter.orgx;
    return          301 https://artifact.metadatacenter.orgx$request_uri;
}

server {
    listen          443 ssl;
    server_name     artifact.metadatacenter.orgx;
    include         cedar/include-ssl.conf;
    location / {
        # Artifact storage has no resource-level ACL data. External callers must use
        # the resource server, which authorizes requests before calling internally.
        return      404;
    }
    error_log       /home/cedar/CEDAR/log/cedar-artifact-server/nginx-error.log warn;
    access_log      /home/cedar/CEDAR/log/cedar-artifact-server/nginx-access.log combined if=$loggable;
}
